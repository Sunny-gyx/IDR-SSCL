[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idr-sscl"
version = "0.1.0"
description = "Official implementation of the ICASSP 2026 IDR-SSCL method"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Yuxuan Gao"},
  {name = "Chi Wen"},
  {name = "He Li"},
  {name = "Qingxiong Tan"},
  {name = "Mang Ye"},
]
requires-python = ">=3.10,<3.13"
dependencies = [
  "easydict>=1.10",
  "matplotlib>=3.7",
  "numpy>=1.24,<3",
  "Pillow>=10",
  "PyYAML>=6",
  "pytorch-lightning>=2.2,<3",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
  "torchmetrics>=1.3,<2",
  "torchvision>=0.17,<1",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["src*"]
